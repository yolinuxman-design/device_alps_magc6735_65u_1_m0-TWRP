name: Build TWRP for magc6735_65u_1_m0

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  DEVICE: magc6735_65u_1_m0
  MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
  BRANCH: twrp-6.0
  JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h /

      - name: Install OpenJDK 8 (omni-6.0 requires Java 8)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:openjdk-r/ppa -y
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          sudo update-java-alternatives -s java-1.8.0-openjdk-amd64
          java -version

      - name: Install Python 2.7 (AOSP 6.0 build scripts are Python 2 only)
        run: |
          set -x
          sudo apt-get install -y libssl-dev zlib1g-dev libsqlite3-dev libbz2-dev libreadline-dev libncurses5-dev libgdbm-dev libffi-dev
          # Try deadsnakes PPA first
          sudo add-apt-repository ppa:deadsnakes/ppa -y || true
          sudo apt-get update || true
          if sudo apt-get install -y python2.7 2>/dev/null && /usr/bin/python2.7 --version 2>&1 | grep -q "2\.7"; then
            echo "python2.7 installed from deadsnakes"
            PY=/usr/bin/python2.7
          else
            echo "deadsnakes unavailable -- building Python 2.7.18 from source"
            cd /tmp
            curl -sLO https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
            tar xf Python-2.7.18.tgz
            cd Python-2.7.18
            ./configure --prefix=/opt/python27 --enable-shared
            make -j"$(nproc)"
            sudo make install
            sudo ln -sf /opt/python27/lib/libpython2.7.so.1.0 /usr/lib/x86_64-linux-gnu/
            sudo ldconfig
            PY=/opt/python27/bin/python2.7
          fi
          sudo ln -sf "$PY" /usr/local/bin/python
          python --version
          python --version 2>&1 | grep -q "Python 2\.7" || { echo "::error::python is not 2.7"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            bc ccache lzop rsync imagemagick squashfs-tools

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/.bin/repo"
          chmod a+x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.email "ci@localhost"
          git config --global user.name "twrp-ci"

      - name: repo init & sync (shallow)
        run: |
          mkdir -p build
          cd build
          repo init -u "$MANIFEST" -b "$BRANCH" --depth=1
          repo sync -c -j"$(nproc)" --no-clone-bundle --no-tags --force-sync

      - name: Checkout device tree into build tree
        uses: actions/checkout@v4
        with:
          path: build/device/alps/magc6735_65u_1_m0

      - name: Verify committed kernel (accepts gzip OR raw ARM64 Image)
        run: |
          K=build/device/alps/magc6735_65u_1_m0/prebuilt/kernel
          test -f "$K" || { echo "::error::prebuilt/kernel missing in repo"; exit 1; }
          file "$K"
          GZIP=$(head -c2 "$K" | od -An -tx1 | tr -d ' \n')
          ARM64=$(od -An -tx1 -j56 -N4 "$K" | tr -d ' \n')
          echo "gzip magic: $GZIP | ARM64 magic: $ARM64"
          if [ "$GZIP" != "1f8b" ] && [ "$ARM64" != "41524d64" ]; then
            echo "::error::kernel is neither gzip Image nor ARM64 boot Image -- you probably committed the whole boot.img. Run: unpackbootimg -i boot.img, then commit the 'boot.img-kernel' file renamed to 'kernel'"
            exit 1
          fi
          if [ "$(stat -c%s "$K")" -eq 16777216 ]; then
            echo "::error::kernel is exactly 16MB -- that is the whole boot.img, not the kernel"
            exit 1
          fi

      - name: Build recoveryimage
        run: |
          cd build
          source build/envsetup.sh
          lunch "omni_${DEVICE}-eng"
          make recoveryimage -j"$(nproc)"

      - name: Upload TWRP image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE }}
          path: build/out/target/product/${{ env.DEVICE }}/recovery.img
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/out/target/product/${{ env.DEVICE }}/*.log
            build/out/*.log

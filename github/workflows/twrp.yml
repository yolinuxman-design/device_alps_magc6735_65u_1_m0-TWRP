name: Build TWRP for magc6735_65u_1_m0
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
env:
  DEVICE: magc6735_65u_1_m0
  MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
  BRANCH: twrp-6.0
  JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
      - name: Install OpenJDK 8 (omni-6.0 requires Java 8)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:openjdk-r/ppa -y
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          sudo update-java-alternatives -s java-1.8.0-openjdk-amd64
      - name: Install build dependencies
        run: |
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip python3 python-is-python3 bc ccache lzop rsync imagemagick squashfs-tools
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/.bin/repo"
          chmod a+x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.email "ci@localhost"
          git config --global user.name "twrp-ci"
      - name: Verify kernel is committed
        run: |
          test -f device/alps/magc6735_65u_1_m0/prebuilt/kernel || \
            { echo "::error::Commit your stock kernel first!"; exit 1; }
      - name: repo init & sync (shallow)
        run: |
          mkdir -p build
          cd build
          repo init -u "$MANIFEST" -b "$BRANCH" --depth=1
          repo sync -c -j"$(nproc)" --no-clone-bundle --no-tags --depth=1 --force-sync
      - name: Copy device tree into build
        run: cp -r "$GITHUB_WORKSPACE/device" build/device
      - name: Build recoveryimage
        run: |
          cd build
          source build/envsetup.sh
          lunch "omni_${DEVICE}-eng"
          make recoveryimage -j"$(nproc)"
      - name: Upload TWRP image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE }}
          path: build/out/target/product/${{ env.DEVICE }}/recovery.img
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/out/target/product/${{ env.DEVICE }}/*.log
            build/out/*.log
